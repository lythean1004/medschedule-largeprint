<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>약 먹는 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-warm: #FAF8F5;
    --bg-card: #FFFFFF;
    --ink-main: #1A202C;
    --ink-sub: #4A5568;
    --ink-light: #718096;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-text: #FFFFFF;
    --safe-bg: #F0FDF4;
    --safe-text: #16A34A;
    --safe-border: #BBF7D0;
    --border-light: #E5E7EB;
    --shadow-card: 0 10px 40px -12px rgba(26, 32, 44, 0.12);
    --shadow-soft: 0 4px 16px -8px rgba(26, 32, 44, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg-warm);
    color: var(--ink-main);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding: 24px 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 8px 0 40px;
  }

  .safety-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 4px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 100px;
    font-size: 15pt;
    font-weight: 700;
    background: var(--safe-bg);
    color: var(--safe-text);
    border: 1.5px solid var(--safe-border);
    box-shadow: var(--shadow-soft);
    letter-spacing: -0.01em;
  }

  .badge-icon { width: 22px; height: 22px; flex-shrink: 0; }

  .header { text-align: center; padding: 8px 0 4px; }

  .header-icon-wrap {
    width: 64px; height: 64px;
    margin: 0 auto 12px;
    background: var(--accent);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.28);
  }

  .header-icon { width: 36px; height: 36px; color: var(--accent-text); }

  h1.title {
    font-size: clamp(34pt, 6vw, 44pt);
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: -0.02em;
    color: var(--ink-main);
    margin: 0 0 8px;
  }

  .subtitle {
    font-size: clamp(17pt, 3vw, 20pt);
    font-weight: 500;
    color: var(--ink-sub);
    line-height: 1.45;
    margin: 0;
  }

  .upload-card {
    background: var(--bg-card);
    border-radius: 28px;
    padding: 32px 24px 28px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border-light);
    text-align: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .upload-card:hover { transform: translateY(-2px); box-shadow: 0 16px 48px -16px rgba(26, 32, 44, 0.16); }

  .upload-card-label {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 16px;
    padding: 18px 24px;
    font-size: clamp(20pt, 4vw, 26pt);
    font-weight: 800;
    cursor: pointer;
    width: 100%;
    text-align: center;
    transition: background 0.15s ease, transform 0.1s ease;
    box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.32);
    letter-spacing: -0.015em;
    line-height: 1.2;
  }

  .upload-card-label:hover { background: var(--accent-hover); transform: scale(1.01); }
  .upload-card-label:active { transform: scale(0.985); box-shadow: 0 4px 12px -4px rgba(37, 99, 235, 0.32); }
  .upload-card-label:focus-visible { outline: 4px solid rgba(37, 99, 235, 0.4); outline-offset: 3px; }

  .upload-card-label-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .upload-icon-wrap {
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.2);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }

  .upload-icon { width: 34px; height: 34px; color: var(--accent-text); }

  .upload-hint {
    font-size: clamp(13pt, 2.4vw, 15pt);
    color: var(--accent-text);
    font-weight: 600;
    opacity: 0.92;
    margin-top: 2px;
  }

  .preset-note {
    margin-top: 18px;
    font-size: clamp(12pt, 2.2vw, 13.5pt);
    color: var(--ink-light);
    font-weight: 500;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .preset-note-icon { width: 20px; height: 20px; color: var(--ink-light); flex-shrink: 0; }

  .status-card {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 20px 22px;
    box-shadow: var(--shadow-soft);
    border: 1px solid var(--border-light);
    text-align: center;
  }

  .status-text { font-size: clamp(16pt, 3vw, 19pt); font-weight: 700; color: var(--ink-main); line-height: 1.45; }

  .status-spinner {
    width: 28px; height: 28px;
    margin: 0 auto 10px;
    border: 4px solid var(--border-light);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .result-card {
    background: var(--bg-card);
    border-radius: 24px;
    padding: 28px 22px 26px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border-light);
  }

  .result-inner {
    font-size: clamp(20pt, 4.5vw, 24pt);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: keep-all;
    font-weight: 700;
    color: var(--ink-main);
    letter-spacing: -0.01em;
  }

  .result-inner h2 {
    font-size: clamp(26pt, 5.5vw, 32pt);
    font-weight: 800;
    margin: 10px 0 4px;
    letter-spacing: -0.02em;
  }

  .result-source {
    margin-top: 14px;
    font-size: clamp(12pt, 2.2vw, 13.5pt);
    color: var(--ink-light);
    font-weight: 500;
    line-height: 1.5;
    padding: 12px 14px;
    background: var(--safe-bg);
    border-radius: 12px;
    border: 1px solid var(--safe-border);
  }

  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 20px;
    justify-content: center;
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--ink-main);
    border: 2px solid var(--border-light);
    border-radius: 14px;
    padding: 14px 22px;
    font-size: clamp(16pt, 3vw, 19pt);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-soft);
    min-height: 56px;
  }

  .btn-secondary:hover { background: #F7F6F3; border-color: #C5C9D0; transform: translateY(-1px); }
  .btn-secondary:active { transform: translateY(0px); }
  .btn-secondary:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.35); outline-offset: 2px; }

  .error-card {
    background: #FFF5F5;
    color: #C53030;
    border-radius: 20px;
    padding: 18px 20px;
    box-shadow: var(--shadow-soft);
    border: 1.5px solid #FED7D7;
    font-size: clamp(15pt, 3vw, 18pt);
    font-weight: 700;
    text-align: center;
    line-height: 1.45;
  }

  .error-card-icon { width: 24px; height: 24px; margin-right: 8px; vertical-align: middle; flex-shrink: 0; }

  .screen-only { display: block; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .upload-btn { display: none; }

  #sourceViewport {
    margin-top: 16px;
    max-height: 65vh;
    overflow: auto;
    border: 1px solid #E5E7EB;
  }

  #sourceViewport:focus-visible {
    outline: 3px solid #2563EB;
    outline-offset: 3px;
  }

  #sourceViewport #sourceImage {
    display: block;
    width: 100%;
    max-width: none;
    height: auto;
    margin: 0;
  }

  #sourceViewport.is-zoomed #sourceImage {
    width: 200%;
  }

  #medication-confirm {
    transform: scale(1.1);
  }

  @media print {
    @page { size: A4; margin: 15mm; }
    body { background: #fff; color: #000; padding: 0; display: block; }
    .page { max-width: none; margin: 0; padding: 0; }
    .safety-badges, .upload-card, .btn-row, .status-card, .error-card { display: none !important; }
    .header { text-align: left; padding: 0; }
    .header-icon-wrap, .header-icon, .header-icon-svg, .header-sub-svg { display: none; }
    .subtitle { color: #000; font-size: 16pt; }
    h1.title { font-size: 26pt; }
    .result-card { box-shadow: none; border: none; padding: 0; }
    .result-inner { font-size: 20pt; line-height: 1.5; }
    .result-inner h2 { font-size: 24pt; }
    .result-source { font-size: 11pt; color: #333; background: none; border: none; }
    .btn-secondary { display: none !important; }
    .preset-note { display: none !important; }

    #draftCard {
      display: none !important;
    }

    #sourceCard {
      display: none !important;
    }
  }
</style>
</head>
<body>
  <div class="page">

    <div class="safety-badges" role="group" aria-label="안심 요소">
      <span class="badge"><svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>회원가입·앱 설치 없음</span>
      <span class="badge"><svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M12 8v8m-4-4h8"/></svg>비용 없음</span>
      <span class="badge"><svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>사진 한 장이면 끝</span>
    </div>

    <div class="header">
      <div class="header-icon-wrap" aria-hidden="true">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 2 5.5 5.5 0 0 0 11 7.5c0 2.33 1.84 5.07 3 5.5l3 3"/>
          <path d="M22 12C22 17 17 22 12 22s-10-5-10-10S2 7 2 12c0 5 4 10 10 10z" stroke-width="1.6"/>
        </svg>
      </div>
      <h1 class="title">약 먹는 시간표</h1>
      <p class="subtitle">약봉투 사진 한 장만 올려주세요.<br>회원가입·앱 설치 없이 바로 볼 수 있습니다.</p>
    </div>

    <div class="upload-card">
      <button type="button" id="pick" class="upload-card-label" aria-label="약봉투 사진 올리기" aria-busy="false">
        <span class="upload-card-label-inner">
          <span class="upload-icon-wrap">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
              <path d="M16 19h-4a2 2 0 0 1-2-2v-1"/>
            </svg>
          </span>
          <span>약봉투 사진 올리기</span>
          <span class="upload-hint">카메라로 찍거나 사진첩에서 고르세요</span>
        </span>
      </button>
      <input type="file" id="file" accept="image/*" class="upload-btn" aria-hidden="true">
      <p class="preset-note">
        <svg class="preset-note-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        사진을 고르면 바로 시간표를 만들어 드립니다
      </p>
    </div>

    <div class="screen-only" id="status" style="display:none;">
      <div class="status-card">
        <div class="status-spinner" aria-hidden="true"></div>
        <p class="status-text">지금 봉투 사진의 글씨를 읽고 있어요. <br>잠시만 기다려 주세요.</p>
      </div>
    </div>

    <div class="result-card screen-only" id="resultCard" style="display:none;">
      <div class="result-inner" id="result" role="region" aria-live="polite" aria-label="복약 시간표 결과"></div>
      <div class="result-source" id="sourceNote"></div>
      <div class="btn-row">
        <button type="button" id="printBtn" class="btn-secondary">인쇄 / 저장</button>
        <button type="button" id="resetBtn" class="btn-secondary">다른 봉투 보기</button>
      </div>
    </div>

    <div class="screen-only" id="errCard" style="display:none;"></div>

<section id="sourceCard"
         class="result-card"
         aria-labelledby="sourceTitle"
         style="display:none;">
  <h2 id="sourceTitle">올린 약봉투 사진</h2>
  <p>아래 초안과 원본을 비교해 주세요.</p>
  <button type="button"
          id="sourceZoomBtn"
          class="btn-secondary"
          aria-controls="sourceViewport"
          aria-expanded="false">
    사진 크게 보기
  </button>
  <div id="sourceViewport"
       tabindex="0"
       role="region"
       aria-label="약봉투 원본 사진. 확대 후 스크롤하여 확인하세요.">
    <img id="sourceImage"
         alt="사용자가 올린 약봉투 원본">
  </div>
</section>

<section id="draftCard"
         class="result-card"
         aria-labelledby="draftTitle"
         style="display:none;">
  <h2 id="draftTitle">약봉투에서 읽은 내용</h2>
  <p>확인 전 초안입니다. 원본과 대조해 주세요.</p>
  <div id="draftList"></div>
  <div id="draftIssues"></div>

  <div id="documentReview" style="margin-top:24px;">
    <label style="display:block; padding:12px;">
      <input type="checkbox" id="documentConfirm" disabled>
      원본의 약 목록과 대조해 빠진 약이 없는지 살폈고,
      각 약의 내용과 문서 확인 사항까지 검토했습니다.
    </label>
    <p id="documentReviewStatus" aria-live="polite"></p>
    <p>현재는 원본 대조·수정 단계입니다. 최종 시간표 인쇄는 준비 중입니다.</p>
  </div>
</section>

  </div>

<script>
(function () {
  var pick = document.getElementById("pick");
  var file = document.getElementById("file");
  var hint = document.getElementById("hint");
  var status = document.getElementById("status");
  var resultCard = document.getElementById("resultCard");
  var result = document.getElementById("result");
  var sourceNote = document.getElementById("sourceNote");
  var errCard = document.getElementById("errCard");
  var printBtn = document.getElementById("printBtn");
  var resetBtn = document.getElementById("resetBtn");
  var isProcessing = false;
  var reviewState = null;

  function setProcessing(active) {
    isProcessing = active;
    pick.disabled = active;
    file.disabled = active;
    resetBtn.disabled = active;
    pick.setAttribute("aria-busy", String(active));
  }

  function hideAll() {
    clearMedicationDraft();
    errCard.style.display = "none";
    resultCard.style.display = "none";
    status.style.display = "none";
  }

  function showErr(msg) {
    clearMedicationDraft();
    resultCard.style.display = "none";
    status.style.display = "none";

    var errorBox = document.createElement("div");
    errorBox.className = "error-card";
    errorBox.setAttribute("role", "alert");
    errorBox.textContent = String(msg);

    errCard.replaceChildren(errorBox);
    errCard.style.display = "block";
  }

  function clearMedicationDraft() {
    reviewState = null;
    document.getElementById("draftCard").style.display = "none";
    document.getElementById("draftList").replaceChildren();
    document.getElementById("draftIssues").replaceChildren();
    updateDocumentReview();
  }

  function clearSourceImage() {
    resetSourceZoom();
    document.getElementById("sourceCard").style.display = "none";
    document.getElementById("sourceImage").removeAttribute("src");
  }

  function showSourceImage(dataUrl) {
    resetSourceZoom();
    var image = document.getElementById("sourceImage");
    image.src = dataUrl;
    document.getElementById("sourceCard").style.display = "block";
  }

  function resetSourceZoom() {
    var viewport = document.getElementById("sourceViewport");
    var button = document.getElementById("sourceZoomBtn");
    viewport.classList.remove("is-zoomed");
    viewport.scrollTop = 0;
    viewport.scrollLeft = 0;
    button.textContent = "사진 크게 보기";
    button.setAttribute("aria-expanded", "false");
  }

  function createReviewState(draft) {
    var originalDraft = JSON.parse(JSON.stringify(draft));

    var medications = originalDraft.medications.map(function (med, index) {
      var values = {};

      ["name", "dose", "frequency", "timing", "duration"].forEach(function (key) {
        values[key] = med[key].status === "found"
          ? med[key].value
          : "";
      });

      return {
        reviewId: "review-" + (index + 1),
        originalIndex: index,
        values: values,
        scheduleType: med.schedule_type,
        timeSlots: med.time_slots.slice(),
        timingSource: null,
        confirmed: false
      };
    });

    return {
      originalDraft: originalDraft,
      medications: medications,
      documentConfirmed: false
    };
  }

  function updateDocumentReview() {
    var box = document.getElementById("documentConfirm");
    var message = document.getElementById("documentReviewStatus");

    if (!reviewState || !reviewState.medications.length) {
      box.checked = false;
      box.disabled = true;
      message.textContent = "약별 대조 확인을 먼저 진행해 주세요.";
      return;
    }

    var total = reviewState.medications.length;
    var confirmed = reviewState.medications.filter(function (medication) {
      return medication.confirmed === true;
    }).length;

    var ready = confirmed === total;

    if (!ready) {
      reviewState.documentConfirmed = false;
    }

    box.disabled = !ready;
    box.checked = ready && reviewState.documentConfirmed === true;

    message.textContent = box.checked
      ? "전체 대조 확인을 표시했습니다. 내용을 수정하면 확인이 해제됩니다."
      : "약 " + total + "개 중 " + confirmed + "개 대조 완료. " +
        (ready
          ? "누락된 약과 문서 확인 사항까지 검토한 뒤 전체 확인을 선택해 주세요."
          : "각 약의 대조 확인을 먼저 완료해 주세요.");
  }

  function renderMedicationDraft(draft) {
    reviewState = null;
    var card = document.getElementById("draftCard");
    var list = document.getElementById("draftList");
    var issues = document.getElementById("draftIssues");

    card.style.display = "none";
    list.replaceChildren();
    issues.replaceChildren();
    resultCard.style.display = "none";

    var fields = [
      ["name", "약 이름"],
      ["dose", "1회 먹는 양"],
      ["frequency", "복용 횟수"],
      ["timing", "복용 시점"],
      ["duration", "며칠분"]
    ];
    var types = {
      daily: "매일 복용",
      as_needed: "필요할 때만 복용",
      non_daily: "매일 먹지 않는 약",
      unresolved: "복용 유형 확인 필요"
    };
    var slots = {
      morning: "아침",
      noon: "점심",
      evening: "저녁",
      bedtime: "자기 전"
    };

    try {
      if (
        !draft ||
        !Array.isArray(draft.medications) ||
        draft.medications.length === 0 ||
        !Array.isArray(draft.document_issues) ||
        !["ok", "partial"].includes(draft.extraction_status)
      ) {
        throw new Error("invalid draft");
      }

      var nextReviewState = createReviewState(draft);

      var fragment = document.createDocumentFragment();

      draft.medications.forEach(function (med, index) {
        if (
          !med ||
          !Object.prototype.hasOwnProperty.call(types, med.schedule_type) ||
          !Array.isArray(med.time_slots) ||
          med.time_slots.some(function (slot) {
            return !Object.prototype.hasOwnProperty.call(slots, slot);
          })
        ) {
          throw new Error("invalid medication");
        }

        var article = document.createElement("article");
        article.style.marginTop = "24px";
        article.style.paddingTop = "16px";
        article.style.borderTop = "1px solid #E5E7EB";
        article.style.overflowWrap = "anywhere";

        var title = document.createElement("h3");
        title.textContent = "약 " + (index + 1);
        article.appendChild(title);

        fields.forEach(function (entry) {
          var field = med[entry[0]];
          if (
            !field ||
            !["found", "unresolved"].includes(field.status) ||
            (field.value !== null && typeof field.value !== "string") ||
            (field.evidence !== null && typeof field.evidence !== "string") ||
            (field.status === "found" &&
              (!field.value || !field.value.trim() ||
               !field.evidence || !field.evidence.trim()))
          ) {
            throw new Error("invalid field");
          }

          var row = document.createElement("p");
          row.style.marginTop = "12px";

          var label = document.createElement("strong");
          label.textContent = entry[1] + ": ";
          row.appendChild(label);

          var key = entry[0];
          var input = document.createElement("input");
          input.type = "text";
          input.id = key + "-" + nextReviewState.medications[index].reviewId;
          input.value = nextReviewState.medications[index].values[key];
          input.placeholder = "원본을 보고 확인해 주세요";
          input.setAttribute(
            "aria-label",
            "약 " + (index + 1) + " " + entry[1] + " 수정"
          );
          input.autocomplete = "off";
          input.spellcheck = false;
          input.style.display = "block";
          input.style.width = "100%";
          input.style.font = "inherit";
          input.style.padding = "10px";
          input.style.marginTop = "6px";

          input.addEventListener("input", function () {
            if (reviewState !== nextReviewState) return;

            var medication = nextReviewState.medications[index];
            medication.values[key] = input.value;
            medication.confirmed = false;
            nextReviewState.documentConfirmed = false;

            var confirmation = article.querySelector(".medication-confirm");
            if (confirmation) {
              confirmation.checked = false;
            }

            var notice = article.querySelector(".medication-confirm-notice");
            if (notice) {
              notice.textContent = "내용이 변경되어 다시 대조해야 합니다.";
            }

            updateDocumentReview();

            if (key === "timing" || key === "frequency") {
              medication.timeSlots = [];
              medication.timingSource = null;

              var sourceControl =
                article.querySelector(".medication-timing-source");
              if (sourceControl) {
                sourceControl.value = "";
              }

              var group = article.querySelector(".medication-slots");
              if (group) {
                group.querySelectorAll('input[type="checkbox"]').forEach(
                  function (checkbox) {
                    checkbox.checked = false;
                  }
                );
              }

              var timeDisplay = article.querySelector(".medication-time");
              if (timeDisplay) {
                timeDisplay.textContent = medication.scheduleType === "daily"
                  ? "시간대: 다시 확인 필요"
                  : medication.scheduleType === "unresolved"
                    ? "복용 유형을 확인해 주세요."
                    : "일반 시간표에 배치하지 않습니다. 복용 시점·조건을 확인해 주세요.";
              }
            }
          });

          row.appendChild(input);
          article.appendChild(row);

          if (field.evidence) {
            var evidence = document.createElement("p");
            evidence.style.color = "#4A5568";
            evidence.textContent = "읽은 근거: " + field.evidence;
            article.appendChild(evidence);
          }
        });

        var medication = nextReviewState.medications[index];

        var typeLabel = document.createElement("label");
        typeLabel.textContent = "복용 유형";
        typeLabel.htmlFor = "type-" + medication.reviewId;
        typeLabel.style.display = "block";
        typeLabel.style.marginTop = "16px";

        var typeSelect = document.createElement("select");
        typeSelect.id = typeLabel.htmlFor;
        typeSelect.style.display = "block";
        typeSelect.style.width = "100%";
        typeSelect.style.font = "inherit";
        typeSelect.style.padding = "10px";

        [
          ["unresolved", "확인 필요"],
          ["daily", "매일 복용"],
          ["as_needed", "필요할 때만 복용"],
          ["non_daily", "매일 먹지 않는 약"]
        ].forEach(function (item) {
          var option = document.createElement("option");
          option.value = item[0];
          option.textContent = item[1];
          typeSelect.appendChild(option);
        });

        typeSelect.value = medication.scheduleType;

        typeSelect.addEventListener("change", function () {
          if (reviewState !== nextReviewState) return;

          medication.scheduleType = typeSelect.value;
          medication.timeSlots = [];
          medication.timingSource = null;

          var confirmation = article.querySelector(".medication-confirm");
          if (confirmation) {
            confirmation.checked = false;
          }

          var notice = article.querySelector(".medication-confirm-notice");
          if (notice) {
            notice.textContent = "내용이 변경되어 다시 대조해야 합니다.";
          }

          updateDocumentReview();

          var sourceControl =
            article.querySelector(".medication-timing-source");
          if (sourceControl) {
            sourceControl.value = "";
          }

          var group = article.querySelector(".medication-slots");
          if (group) {
            group.disabled = medication.scheduleType !== "daily";
            group.querySelectorAll('input[type="checkbox"]').forEach(
              function (checkbox) {
                checkbox.checked = false;
              }
            );
          }

          medication.confirmed = false;
          nextReviewState.documentConfirmed = false;

          var timeDisplay = article.querySelector(".medication-time");
          if (timeDisplay) {
            timeDisplay.textContent = medication.scheduleType === "daily"
              ? "시간대: 다시 확인 필요"
              : medication.scheduleType === "unresolved"
                ? "복용 유형을 확인해 주세요."
                : "일반 시간표에 배치하지 않습니다. 복용 시점·조건을 확인해 주세요.";
          }
        });

        article.appendChild(typeLabel);
        article.appendChild(typeSelect);

        var timeEl = document.createElement("p");
        timeEl.className = "medication-time";

        if (medication.scheduleType === "daily") {
          timeEl.textContent = "시간대: " + (
            medication.timeSlots.length
              ? medication.timeSlots.map(function (slot) {
                  return slots[slot];
                }).join(" · ")
              : "확인 필요"
          );
        } else if (medication.scheduleType === "unresolved") {
          timeEl.textContent = "복용 유형을 확인해 주세요.";
        } else {
          timeEl.textContent =
            "일반 시간표에 배치하지 않습니다. 복용 시점·조건을 확인해 주세요.";
        }

        article.appendChild(timeEl);

        var slotGroup = document.createElement("fieldset");
        slotGroup.className = "medication-slots";
        slotGroup.style.marginTop = "12px";
        slotGroup.style.padding = "12px";
        slotGroup.disabled = medication.scheduleType !== "daily";

        var slotLegend = document.createElement("legend");
        slotLegend.textContent = "원본 또는 약사에게 확인한 시간대";
        slotGroup.appendChild(slotLegend);

        var slotHint = document.createElement("p");
        slotHint.textContent =
          "횟수만 보고 선택하지 마세요. 확인되지 않으면 비워 두세요.";
        slotGroup.appendChild(slotHint);

        [
          ["morning", "아침"],
          ["noon", "점심"],
          ["evening", "저녁"],
          ["bedtime", "자기 전"]
        ].forEach(function (item) {
          var slotLabel = document.createElement("label");
          slotLabel.style.display = "block";
          slotLabel.style.padding = "8px 0";

          var checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = item[0];
          checkbox.checked =
            medication.scheduleType === "daily" &&
            medication.timeSlots.includes(item[0]);
          checkbox.style.marginRight = "8px";

          checkbox.addEventListener("change", function () {
            if (reviewState !== nextReviewState) return;
            if (medication.scheduleType !== "daily") return;

            medication.timeSlots = Array.from(
              slotGroup.querySelectorAll("input:checked")
            ).map(function (element) {
              return element.value;
            });

            medication.timingSource = null;
            medication.confirmed = false;

            var confirmation = article.querySelector(".medication-confirm");
            if (confirmation) {
              confirmation.checked = false;
            }

            var notice = article.querySelector(".medication-confirm-notice");
            if (notice) {
              notice.textContent = "내용이 변경되어 다시 대조해야 합니다.";
            }

            var sourceControl =
              article.querySelector(".medication-timing-source");
            if (sourceControl) {
              sourceControl.value = "";
            }

            updateDocumentReview();

            nextReviewState.documentConfirmed = false;

            timeEl.textContent = "시간대: " + (
              medication.timeSlots.length
                ? medication.timeSlots.map(function (slot) {
                    return slots[slot];
                  }).join(" · ")
                : "확인 필요"
            );
          });

          slotLabel.appendChild(checkbox);
          slotLabel.appendChild(document.createTextNode(item[1]));
          slotGroup.appendChild(slotLabel);
        });

        var sourceLabel = document.createElement("label");
        sourceLabel.htmlFor = "timing-source-" + medication.reviewId;
        sourceLabel.textContent = "복용 시점·시간대 확인 근거";
        sourceLabel.style.display = "block";
        sourceLabel.style.marginTop = "16px";

        var sourceSelect = document.createElement("select");
        sourceSelect.id = sourceLabel.htmlFor;
        sourceSelect.className = "medication-timing-source";
        sourceSelect.style.display = "block";
        sourceSelect.style.width = "100%";
        sourceSelect.style.font = "inherit";
        sourceSelect.style.padding = "10px";

        [
          ["", "아직 확인하지 못함"],
          ["original", "원본에 명시된 내용을 직접 확인함"],
          ["pharmacist", "약사에게 직접 확인함"]
        ].forEach(function (item) {
          var option = document.createElement("option");
          option.value = item[0];
          option.textContent = item[1];
          sourceSelect.appendChild(option);
        });

        sourceSelect.value = "";

        sourceSelect.addEventListener("change", function () {
          if (reviewState !== nextReviewState) return;

          medication.timingSource =
            sourceSelect.value === "original" ||
            sourceSelect.value === "pharmacist"
              ? sourceSelect.value
              : null;

          medication.confirmed = false;

          var confirmation = article.querySelector(".medication-confirm");
          if (confirmation) {
            confirmation.checked = false;
          }

          var notice = article.querySelector(".medication-confirm-notice");
          if (notice) {
            notice.textContent = "내용이 변경되어 다시 대조해야 합니다.";
          }

          updateDocumentReview();

          nextReviewState.documentConfirmed = false;
        });

        var sourceHint = document.createElement("p");
        sourceHint.textContent =
          "이 약의 복용 시점·조건과 선택한 시간대를 확인한 경우에만 고르세요. AI가 읽은 근거만 보고 확인 완료로 선택하지 마세요.";
        sourceHint.style.marginTop = "8px";

        article.appendChild(sourceLabel);
        article.appendChild(sourceSelect);
        article.appendChild(sourceHint);

        var confirmLabel = document.createElement("label");
        confirmLabel.style.display = "block";
        confirmLabel.style.marginTop = "20px";
        confirmLabel.style.padding = "12px";

        var confirmBox = document.createElement("input");
        confirmBox.type = "checkbox";
        confirmBox.className = "medication-confirm";
        confirmBox.checked = false;
        confirmBox.style.marginRight = "8px";

        var confirmNotice = document.createElement("p");
        confirmNotice.className = "medication-confirm-notice";
        confirmNotice.setAttribute("aria-live", "polite");

        confirmBox.addEventListener("change", function () {
          if (reviewState !== nextReviewState) return;

          nextReviewState.documentConfirmed = false;

          if (!confirmBox.checked) {
            medication.confirmed = false;
            confirmNotice.textContent = "확인을 해제했습니다.";
            updateDocumentReview();
            return;
          }

          var missing = [];

          [
            ["name", "약 이름"],
            ["dose", "1회 먹는 양"],
            ["timing", "복용 시점·조건"]
          ].forEach(function (item) {
            var value = medication.values[item[0]];
            if (typeof value !== "string" || !value.trim()) {
              missing.push(item[1]);
            }
          });

          if (!["daily", "as_needed", "non_daily"].includes(
            medication.scheduleType
          )) {
            missing.push("복용 유형");
          }

          if (medication.scheduleType === "daily") {
            var frequency = medication.values.frequency;
            if (typeof frequency !== "string" || !frequency.trim()) {
              missing.push("복용 횟수");
            }
            if (medication.timeSlots.length === 0) {
              missing.push("복용 시간대");
            }
          } else if (medication.timeSlots.length > 0) {
            missing.push("일반 시간대 선택 해제");
          }

          if (!["original", "pharmacist"].includes(
            medication.timingSource
          )) {
            missing.push("복용 시점·시간대 확인 근거");
          }

          if (missing.length > 0) {
            confirmBox.checked = false;
            medication.confirmed = false;
            confirmNotice.textContent =
              "먼저 확인해 주세요: " + missing.join(", ");
            updateDocumentReview();
            return;
          }

          medication.confirmed = true;
          confirmNotice.textContent =
            "사용자가 대조했음을 표시했습니다. 내용을 수정하면 확인이 해제됩니다.";

          updateDocumentReview();
        });

        confirmLabel.appendChild(confirmBox);
        confirmLabel.appendChild(document.createTextNode(
          "약 이름·1회량·횟수·복용 시점·조건을 원본과 대조했고, 불명확한 내용은 약사에게 확인했습니다."
        ));

        article.appendChild(confirmLabel);
        article.appendChild(confirmNotice);
        fragment.appendChild(article);
      });

      var issueFragment = document.createDocumentFragment();
      draft.document_issues.forEach(function (issue) {
        if (typeof issue !== "string") {
          throw new Error("invalid issue");
        }
        var p = document.createElement("p");
        p.textContent = "확인 사항: " + issue;
        issueFragment.appendChild(p);
      });

      list.appendChild(fragment);
      issues.appendChild(issueFragment);
      reviewState = nextReviewState;
      updateDocumentReview();
      card.style.fontSize = "20px";
      card.style.lineHeight = "1.6";
      errCard.style.display = "none";
      status.style.display = "none";
      card.style.display = "block";
    } catch (error) {
      reviewState = null;
      list.replaceChildren();
      issues.replaceChildren();
      card.style.display = "none";
      showErr("약별 초안 형식을 확인하지 못했습니다.");
    }
  }

  function postSchedule(dataUrl) {
    return (
      fetch("/api/schedule", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image_b64: dataUrl })
      })
        .then(function (r) {
          if (!r.ok) {
            throw new Error("초안 요청 실패");
          }
          return r.json();
        })
        .then(function (json) {
          status.style.display = "none";

          if (!json || typeof json !== "object" || Array.isArray(json)) {
            showErr("약별 초안 응답을 확인하지 못했습니다.");
            return;
          }

          if (json.error) {
            showErr("약별 초안을 만들지 못했습니다. 다시 시도해 주세요.");
            return;
          }

          if (!json.draft) {
            showErr("약별 초안이 없습니다. 다시 시도해 주세요.");
            return;
          }

          result.textContent = "";
          sourceNote.textContent = "";
          renderMedicationDraft(json.draft);
        })
        .catch(function () {
          status.style.display = "none";
          showErr("약별 초안을 만드는 중 오류가 났습니다. 다시 시도해 주세요.");
        })
    );
  }

  pick.addEventListener("click", function () {
    if (isProcessing) return;
    file.value = "";
    file.click();
  });

  file.addEventListener("change", function () {
    if (isProcessing) return;

    var f = file.files && file.files[0];
    if (!f) return;

    setProcessing(true);
    clearSourceImage();
    clearMedicationDraft();
    hideAll();
    result.textContent = "";
    sourceNote.textContent = "";
    status.style.display = "block";

    var reader = new FileReader();

    reader.onload = function (e) {
      Promise.resolve()
        .then(function () {
          showSourceImage(e.target.result);
          return postSchedule(e.target.result);
        })
        .catch(function () {
          showErr("약별 초안을 만드는 중 오류가 났습니다. 다시 시도해 주세요.");
        })
        .finally(function () {
          setProcessing(false);
        });
    };

    reader.onerror = function () {
      showErr("사진을 읽지 못했습니다. 다시 골라 주세요.");
      setProcessing(false);
    };

    reader.onabort = function () {
      showErr("사진 읽기가 취소됐습니다.");
      setProcessing(false);
    };

    try {
      reader.readAsDataURL(f);
    } catch (error) {
      showErr("사진을 읽지 못했습니다. 다시 골라 주세요.");
      setProcessing(false);
    }
  });

  printBtn.addEventListener("click", function () {
    window.print();
  });

  resetBtn.addEventListener("click", function () {
    if (isProcessing) return;
    clearSourceImage();
    file.value = "";
    hideAll();
    result.textContent = "";
    sourceNote.textContent = "";
  });

  document.getElementById("sourceZoomBtn")
    .addEventListener("click", function () {
      var viewport = document.getElementById("sourceViewport");
      var expanded = viewport.classList.toggle("is-zoomed");
      this.textContent = expanded ? "사진 크기 되돌리기" : "사진 크게 보기";
      this.setAttribute("aria-expanded", String(expanded));

      if (!expanded) {
        viewport.scrollTop = 0;
        viewport.scrollLeft = 0;
      }

      viewport.focus();
    });

  document.getElementById("documentConfirm")
    .addEventListener("change", function () {
      if (!reviewState) {
        updateDocumentReview();
        return;
      }

      var ready = reviewState.medications.length > 0 &&
        reviewState.medications.every(function (medication) {
          return medication.confirmed === true;
        });

      reviewState.documentConfirmed = ready && this.checked;
      updateDocumentReview();
    });
})();
</script>
</body>
</html>
